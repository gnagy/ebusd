name: eBUSd (dev)
version: "26.1-f300ec55"
slug: ebusd_dev
description: >
  ebusd from the gnagy/ebusd fork (appending, dated raw logs and a telegram log), in a copy
  of the eBUSd app 26.1.10 from LukasGrebe/ha-addons. Built locally from ha-addon/build.sh's
  binaries; not published.
url: https://github.com/gnagy/ebusd
arch:
  - amd64

init: false
startup: services
ingress: true
ingress_port: 7681
services:
  - mqtt:want
uart: true
map:
  - app_config:rw
  - share:rw
ports:
  8888/tcp: null
  8889/tcp: null
ports_description:
  8888/tcp: eBUSd TCP command port
  8889/tcp: eBUSd HTTP port (set --httpport=8889 in commandline_options to enable)
options:
  seed_mqtt_cfg: true
  commandline_options:
    - "--mqttjson"
  sqlite_retention_days: 10
schema:
  device: "device(subsystem=tty)?"
  network_device: "str?"
  seed_mqtt_cfg: bool
  commandline_options: ["str"]
  sqlite_db: "str?"
  sqlite_retention_days: "int(0,)"
